name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pooln
          POSTGRES_PASSWORD: pooln
          POSTGRES_DB: pooln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pooln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pooln:pooln@localhost:5432/pooln
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      # DynamoDB Local doesn't validate credentials — dummy values are fine.
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_TABLE_NAME: poolnDB
      DYNAMODB_ENDPOINT: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # GitHub Actions' declarative `services:` block can't override a
      # service image's command, and DynamoDB Local needs -inMemory (its
      # default -dbPath SQLite file can't be opened on some volume setups —
      # see docker/docker-compose.yml) — so it's started by hand instead.
      - name: Start DynamoDB Local
        run: docker run -d --name dynamodb-local -p 8000:8000 amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -inMemory -sharedDb

      - run: pnpm install --frozen-lockfile

      - name: Create test database
        run: PGPASSWORD=pooln psql -h localhost -U pooln -d pooln -c "CREATE DATABASE pooln_test;"

      - run: pnpm --filter api prisma:generate

      - run: pnpm -r typecheck

      - run: pnpm -r lint

      - run: pnpm -r test
