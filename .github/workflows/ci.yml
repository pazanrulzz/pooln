name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pooln
          POSTGRES_PASSWORD: pooln
          POSTGRES_DB: pooln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pooln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pooln:pooln@localhost:5432/pooln
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api prisma:generate

      - run: pnpm -r typecheck

      - run: pnpm -r lint

      - run: pnpm -r test
