services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pooln
      POSTGRES_PASSWORD: pooln
      POSTGRES_DB: pooln
    ports:
      - "5432:5432"
    volumes:
      - pooln_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pooln"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pooln_postgres_data:
